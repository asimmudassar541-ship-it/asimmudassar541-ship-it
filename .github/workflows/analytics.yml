name: Update GitHub Analytics

on:
  push:
    paths-ignore:
      - "profile/analytics.svg"

  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Analytics
        env:
          GITHUB_API_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python .github/scripts/analytics.py

      - name: Commit Analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/analytics.svg

          git commit -m "Update GitHub analytics" || exit 0

          git push
